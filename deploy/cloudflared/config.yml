# Modelo da configuração do cloudflared (túnel criado pela linha de comando).
# Não edite à mão: o README gera /etc/cloudflared/config.yml com o envsubst, que troca as variáveis TUNEL_ID
# (o UUID do túnel) e DOMINIO (o domínio de MASSGEN_URL_PUBLICA, no .env). Passo a passo: "Hospedar para o time", no README.

tunnel: ${TUNEL_ID}
credentials-file: /etc/cloudflared/${TUNEL_ID}.json

ingress:
  - hostname: ${DOMINIO}
    # O app escuta só em 127.0.0.1 (MASSGEN_HOST no .env): o cloudflared, na mesma VM, é o único caminho até ele.
    # Use 127.0.0.1, e não localhost, que pode resolver para ::1.
    service: http://127.0.0.1:3000
    # Camada opcional (deploy/cloudflare-access.md): com o Cloudflare Access ligado, descomente as linhas abaixo.
    # O cloudflared passa a recusar toda requisição sem um token válido da aplicação do Access; se o Access for
    # desligado no painel por engano, as requisições param aqui.
    # originRequest:
    #   access:
    #     required: true
    #     teamName: sua-equipe                  # o "sua-equipe" de sua-equipe.cloudflareaccess.com
    #     audTag:
    #       - COLE_AQUI_O_AUD_TAG_DA_APLICACAO  # Application Audience (AUD) Tag da aplicação no Access
  # Qualquer outro endereço que chegue ao túnel recebe 404.
  - service: http_status:404
